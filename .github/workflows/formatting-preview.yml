name: Audit Formatting Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formatting-preview:
    if: github.head_ref == 'audit/pre-sale-ci-independent-checks' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Preview Prettier changes without committing
        run: |
          bunx prettier --write .
          git diff --numstat > formatting-numstat.txt
          git diff --binary > formatting.patch
          git diff --stat | tail -35
          echo "Files requiring formatting:"
          git diff --name-only | wc -l
          echo "Patch size:"
          wc -c formatting.patch
      - uses: actions/upload-artifact@v4
        with:
          name: localix-formatting-preview
          path: |
            formatting.patch
            formatting-numstat.txt
          retention-days: 7
