name: Audit Formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-audit-branch:
    if: github.head_ref == 'audit/pre-sale-ci-independent-checks' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format tracked files
        run: |
          bunx prettier --write .
          git diff --check
          git diff --stat | tail -35
          echo "Files changed by Prettier:"
          git diff --name-only | wc -l
      - name: Commit formatting only to audit branch
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply Prettier formatting in isolated audit branch"
          git push origin HEAD:refs/heads/audit/pre-sale-ci-independent-checks
